name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      hotfix_jetbrains_version:
        description: >-
          Set to publish JetBrains only, reusing native-daemon binaries already
          built (and, for macOS, already signed) by an earlier tag run — for
          when that run got VS Code/Open VSX published but died before
          JetBrains. Format: "1.0.1", no "v" prefix. Leave blank for a normal
          manual run (does nothing; this workflow's real trigger is the tag).
        required: false
        type: string
      hotfix_source_run_id:
        description: >-
          The run ID of the tag push whose build-native-daemon artifacts to
          reuse (from that run's URL: .../actions/runs/<this number>). Required
          together with hotfix_jetbrains_version.
        required: false
        type: string

permissions:
  contents: write

jobs:
  # ── Version consistency is verified before anything is built or published ────
  # The tag is the single source of truth. Every versioned artifact — the VS Code
  # extension and the JetBrains plugin — must agree with it.
  #
  # This job exists because the JetBrains plugin version was previously a hardcoded
  # literal in build.gradle.kts that no check compared against the tag: every release
  # after the first therefore republished the same version, the Marketplace rejected
  # it as a duplicate, and (because the publish step was `continue-on-error`) the
  # release reported success while the plugin silently never updated.
  verify-versions:
    name: Verify version consistency
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Verify every versioned artifact matches the tag
        env:
          TAG_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          fail=0

          check() {
            local name="$1" actual="$2"
            if [ "$actual" != "$TAG_VERSION" ]; then
              echo "::error::Version mismatch: $name=$actual, tag=$TAG_VERSION"
              fail=1
            else
              echo "OK: $name=$actual"
            fi
          }

          check "animoria-vscode/package.json" \
            "$(node -p "require('./packages/animoria-vscode/package.json').version")"

          # The Gradle build reads ANIMORIA_VERSION; assert it resolves to the tag
          # rather than to its local-development fallback.
          RESOLVED_GRADLE_VERSION="${ANIMORIA_VERSION:-$TAG_VERSION}"
          check "jetbrains (ANIMORIA_VERSION)" "$RESOLVED_GRADLE_VERSION"

          if grep -qE '^version\s*=\s*"[0-9]' packages/animoria-jetbrains/build.gradle.kts; then
            echo "::error::build.gradle.kts pins a literal release version; it must derive from ANIMORIA_VERSION"
            fail=1
          fi

          exit $fail

  build-native-daemon:
    name: Build native daemon (${{ matrix.platform_arch }})
    needs: verify-versions
    strategy:
      # Every entry here is a real vsce/Open VSX platform target string — the
      # VS Code packaging step below reuses these names directly. A platform
      # missing from this matrix is a platform the extension ships with no
      # native binary, and the JetBrains plugin falls back to requiring a
      # system Rust/Node install, which most users do not have.
      matrix:
        include:
          - os: ubuntu-latest
            platform_arch: linux-x64
          - os: ubuntu-24.04-arm
            platform_arch: linux-arm64
          - os: macos-latest
            platform_arch: darwin-arm64
          - os: windows-latest
            platform_arch: win32-x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)

      - name: Cache cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/animoria-core-rust/target
          key: ${{ matrix.platform_arch }}-cargo-${{ hashFiles('packages/animoria-core-rust/Cargo.lock') }}
          restore-keys: ${{ matrix.platform_arch }}-cargo-

      - name: Build release binary
        run: cargo build --release --manifest-path packages/animoria-core-rust/Cargo.toml

      - name: Import macOS signing certificate
        # A fresh runner's keychain is empty — ANIMORIA_SIGNING_IDENTITY alone
        # names an identity, it doesn't put its certificate anywhere codesign
        # can find it. This decodes the exported .p12 into a throwaway keychain
        # so the signing step below actually has something to sign with.
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "MACOS_CERTIFICATE not set; the signing step below will fail its own required-signing check."
            exit 0
          fi
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Unquoted on purpose: list-keychains prints one keychain per line, and
          # this needs each to arrive as its own argument to -s, not one blob with
          # embedded newlines (which is what quoting it here produced before).
          security list-keychain -d user -s build.keychain $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f "$RUNNER_TEMP/certificate.p12"
          # Count only, not the label: the identity's Common Name is masked as
          # *** everywhere else in this workflow (it comes from the
          # MACOS_SIGNING_IDENTITY secret), so printing it here in the clear
          # would be the one place it leaks.
          echo "codesign identities available after import: $(security find-identity -v -p codesigning build.keychain | grep -c '^[[:space:]]*[0-9]\+)')"

      - name: Sign and notarize macOS binary
        # An ad-hoc signature satisfies the loader on the machine that produced
        # it and nothing else: Gatekeeper rejects an ad-hoc-signed binary
        # downloaded from the internet, so a release shipping one fails to
        # launch its daemon on every user's Mac. Missing credentials must fail
        # this job rather than silently ship an unlaunchable binary.
        if: runner.os == 'macOS'
        env:
          ANIMORIA_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          ANIMORIA_NOTARIZE_APPLE_ID: ${{ secrets.MACOS_NOTARIZE_APPLE_ID }}
          ANIMORIA_NOTARIZE_TEAM_ID: ${{ secrets.MACOS_NOTARIZE_TEAM_ID }}
          ANIMORIA_NOTARIZE_PASSWORD: ${{ secrets.MACOS_NOTARIZE_PASSWORD }}
        run: |
          set -euo pipefail
          BIN="packages/animoria-core-rust/target/release/animoria"

          if [ -z "$ANIMORIA_SIGNING_IDENTITY" ]; then
            echo "::error::ANIMORIA_SIGNING_IDENTITY is not set."
            exit 1
          fi
          codesign --sign "$ANIMORIA_SIGNING_IDENTITY" --options runtime --timestamp --force "$BIN"

          if [ -z "$ANIMORIA_NOTARIZE_APPLE_ID" ] || [ -z "$ANIMORIA_NOTARIZE_TEAM_ID" ] || [ -z "$ANIMORIA_NOTARIZE_PASSWORD" ]; then
            echo "::error::Notarization credentials are incomplete — a signed-but-unnotarized binary is still blocked by Gatekeeper."
            exit 1
          fi
          ZIP="$BIN.zip"
          ditto -c -k --keepParent "$BIN" "$ZIP"
          xcrun notarytool submit "$ZIP" \
            --apple-id "$ANIMORIA_NOTARIZE_APPLE_ID" \
            --team-id "$ANIMORIA_NOTARIZE_TEAM_ID" \
            --password "$ANIMORIA_NOTARIZE_PASSWORD" \
            --wait
          rm -f "$ZIP"

      - name: Stage binary for upload
        shell: bash
        run: |
          set -euo pipefail
          BIN_NAME=animoria
          if [ "${{ runner.os }}" = "Windows" ]; then BIN_NAME=animoria.exe; fi
          mkdir -p "native-daemon/${{ matrix.platform_arch }}"
          cp "packages/animoria-core-rust/target/release/$BIN_NAME" "native-daemon/${{ matrix.platform_arch }}/$BIN_NAME"
          chmod +x "native-daemon/${{ matrix.platform_arch }}/$BIN_NAME" || true

      - name: Verify the produced binary runs
        shell: bash
        run: |
          set -euo pipefail
          BIN_NAME=animoria
          if [ "${{ runner.os }}" = "Windows" ]; then BIN_NAME=animoria.exe; fi
          "native-daemon/${{ matrix.platform_arch }}/$BIN_NAME" --version

      - name: Upload native daemon artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-daemon-${{ matrix.platform_arch }}
          path: native-daemon
          if-no-files-found: error

  release:
    name: Publish Extension and Plugin
    runs-on: ubuntu-latest
    needs: [verify-versions, build-native-daemon]
    env:
      # Consumed by packages/animoria-jetbrains/build.gradle.kts. Without it the
      # Gradle build falls back to 0.0.0-dev, which the publish step below refuses.
      ANIMORIA_VERSION: ${{ needs.verify-versions.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      # Every release-critical gate, and none of them `continue-on-error`. A release
      # that cannot produce a correct artifact must fail rather than ship one.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Verify the VS Code extension carries the shared UI bundle
        run: |
          set -euo pipefail
          # Same class of defect as the plugin jar: an extension without the bundle
          # opens a blank webview. `copy-ui.mjs` already fails the build when the
          # bundle is absent; this asserts the output rather than trusting the step.
          for f in packages/animoria-vscode/media/animoria-ui.js packages/animoria-vscode/media/tokens.css; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing — the extension's panel would be blank"
              exit 1
            fi
          done

      - name: Install vsce and ovsx
        run: npm install -g @vscode/vsce ovsx

      - name: Resolve version
        id: version
        run: echo "VERSION=${{ needs.verify-versions.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Download native daemon artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-daemon-*
          path: native-daemon
          merge-multiple: true

      - name: Restore native daemon executable permissions
        # GitHub Actions artifact upload/download does not preserve the
        # executable bit on non-Windows binaries.
        run: find native-daemon -type f -name animoria -exec chmod +x {} \;

      - name: Package and publish VS Code extension per platform
        # One .vsix per target, each bundling only that platform's binary in
        # `bin/` (see `daemon-client.ts`'s `resolveBinaryPath`, which looks
        # there first) — a single platform-agnostic .vsix has nowhere to put
        # four different native binaries at once.
        working-directory: packages/animoria-vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          for target in linux-x64 linux-arm64 darwin-arm64 win32-x64; do
            rm -rf bin
            mkdir -p bin
            cp -r "../../native-daemon/$target/." bin/
            VSIX="animoria-${VERSION}-${target}.vsix"
            vsce package --target "$target" --no-dependencies -o "$VSIX"
            vsce publish --target "$target" --no-dependencies --packagePath "$VSIX"
            ovsx publish "$VSIX" --target "$target" -p "$OVSX_PAT"
          done

      - name: Stage native daemon for the JetBrains plugin
        run: |
          mkdir -p packages/animoria-jetbrains/src/main/resources/native
          cp -r native-daemon/. packages/animoria-jetbrains/src/main/resources/native/

      - name: Build and verify JetBrains Plugin
        run: |
          set -euo pipefail
          cd packages/animoria-jetbrains
          chmod +x ./gradlew
          # The shared UI bundle is copied in by the `copySharedUi` Gradle task, which
          # `processResources` depends on and which *fails* when the bundle is
          # missing. It used to be a `cp` of the sandbox's dist into `resources/assets`,
          # which no longer exists and which nothing read even when it did — the
          # plugin shipped a directory of dead files and a blank panel.
          #
          # `verifyPlugin` runs on every pull request; it must also run here, so a
          # release can never ship a plugin that CI would have rejected.
          ./gradlew buildPlugin verifyPlugin

      - name: Verify the plugin jar carries the shared UI bundle
        run: |
          set -euo pipefail
          # A plugin without the bundle installs, launches, and renders an empty
          # rectangle with nothing in the log. That is a release-blocking defect and
          # it is invisible to `verifyPlugin`, so it is asserted here.
          JAR=$(find packages/animoria-jetbrains/build/libs -maxdepth 1 -name 'instrumented-*.jar' | head -1)
          if [ -z "$JAR" ]; then
            echo "::error::No instrumented plugin jar was produced"
            exit 1
          fi
          for entry in web/animoria-ui.global.js web/tokens.css; do
            if ! unzip -l "$JAR" | grep -q "$entry"; then
              echo "::error::$entry is missing from the plugin jar — the tool window would be blank"
              exit 1
            fi
          done

      - name: Assert built plugin carries the release version
        run: |
          set -euo pipefail
          EXPECTED="${{ steps.version.outputs.VERSION }}"
          if ! ls packages/animoria-jetbrains/build/distributions/*-"$EXPECTED".zip >/dev/null 2>&1; then
            echo "::error::No plugin distribution found for version $EXPECTED"
            ls -la packages/animoria-jetbrains/build/distributions/ || true
            exit 1
          fi

      # NOT `continue-on-error`. A failed Marketplace publish must fail the release:
      # silently swallowing it is what allowed the plugin to stop updating unnoticed.
      - name: Publish to JetBrains Marketplace
        env:
          JETBRAINS_PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
        run: |
          cd packages/animoria-jetbrains
          ./gradlew publishPlugin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            packages/animoria-vscode/animoria-${{ steps.version.outputs.VERSION }}-*.vsix
            packages/animoria-jetbrains/build/distributions/*.zip
          generate_release_notes: true
          body: |
            ## Animoria v${{ steps.version.outputs.VERSION }}

            See [CHANGELOG.md](https://github.com/sxnnyside-project/animoria/blob/main/packages/animoria-vscode/CHANGELOG.md) for details.

            ### Install
            Search **Animoria** in the VS Code Extensions panel — the Marketplace
            serves the .vsix matching your platform automatically — or download
            the one for your platform from this release and install manually:

            ```
            code --install-extension animoria-${{ steps.version.outputs.VERSION }}-<platform>.vsix
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hotfix-jetbrains:
    name: Hotfix — publish JetBrains only
    # Only runs when explicitly asked for via workflow_dispatch input, never
    # on the tag-push trigger — this must not become a second path that
    # publishes JetBrains on every normal release.
    if: github.event_name == 'workflow_dispatch' && inputs.hotfix_jetbrains_version != ''
    runs-on: ubuntu-latest
    env:
      ANIMORIA_VERSION: ${{ inputs.hotfix_jetbrains_version }}

    steps:
      - name: Require a source run id
        if: inputs.hotfix_source_run_id == ''
        run: |
          echo "::error::hotfix_source_run_id is required alongside hotfix_jetbrains_version."
          exit 1

      # Deliberately NOT the tag: the version label comes from
      # hotfix_jetbrains_version regardless of ref, and checking out the tag
      # would re-run this hotfix against whatever bug caused it to be needed
      # in the first place — including a stale verify-packaged-daemon.mjs
      # timeout that predates the very fix this job exists to apply. Runs
      # against whichever branch you dispatch this workflow from (main, by
      # default, in the "Run workflow" UI).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only what JetBrains needs — never installs vsce/ovsx, never touches
      # either marketplace.
      - name: Build @animoria/ui
        run: pnpm --filter @animoria/ui build

      - name: Download native daemon artifacts from the source run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-daemon-*
          path: native-daemon
          merge-multiple: true
          run-id: ${{ inputs.hotfix_source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore native daemon executable permissions
        run: find native-daemon -type f -name animoria -exec chmod +x {} \;

      - name: Stage native daemon for the JetBrains plugin
        run: |
          mkdir -p packages/animoria-jetbrains/src/main/resources/native
          cp -r native-daemon/. packages/animoria-jetbrains/src/main/resources/native/

      - name: Build and verify JetBrains Plugin
        run: |
          set -euo pipefail
          cd packages/animoria-jetbrains
          chmod +x ./gradlew
          ./gradlew buildPlugin verifyPlugin

      - name: Verify the plugin jar carries the shared UI bundle
        run: |
          set -euo pipefail
          JAR=$(find packages/animoria-jetbrains/build/libs -maxdepth 1 -name 'instrumented-*.jar' | head -1)
          if [ -z "$JAR" ]; then
            echo "::error::No instrumented plugin jar was produced"
            exit 1
          fi
          for entry in web/animoria-ui.global.js web/tokens.css; do
            if ! unzip -l "$JAR" | grep -q "$entry"; then
              echo "::error::$entry is missing from the plugin jar — the tool window would be blank"
              exit 1
            fi
          done

      - name: Assert built plugin carries the release version
        run: |
          set -euo pipefail
          EXPECTED="${{ inputs.hotfix_jetbrains_version }}"
          if ! ls packages/animoria-jetbrains/build/distributions/*-"$EXPECTED".zip >/dev/null 2>&1; then
            echo "::error::No plugin distribution found for version $EXPECTED"
            ls -la packages/animoria-jetbrains/build/distributions/ || true
            exit 1
          fi

      - name: Publish to JetBrains Marketplace
        env:
          JETBRAINS_PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
        run: |
          cd packages/animoria-jetbrains
          ./gradlew publishPlugin

      # Repackaged locally only as a release asset — this never calls `vsce
      # publish`, so it cannot collide with the version already live on the
      # VS Code Marketplace from the original run.
      - name: Repackage VS Code extension for the release asset only
        run: npm install -g @vscode/vsce

      - name: Package extension per platform (no publish)
        working-directory: packages/animoria-vscode
        run: |
          set -euo pipefail
          VERSION="${{ inputs.hotfix_jetbrains_version }}"
          for target in linux-x64 linux-arm64 darwin-arm64 win32-x64; do
            rm -rf bin
            mkdir -p bin
            cp -r "../../native-daemon/$target/." bin/
            vsce package --target "$target" --no-dependencies -o "animoria-${VERSION}-${target}.vsix"
          done

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ inputs.hotfix_jetbrains_version }}
          files: |
            packages/animoria-vscode/animoria-${{ inputs.hotfix_jetbrains_version }}-*.vsix
            packages/animoria-jetbrains/build/distributions/*.zip
          generate_release_notes: true
          body: |
            ## Animoria v${{ inputs.hotfix_jetbrains_version }}

            See [CHANGELOG.md](https://github.com/sxnnyside-project/animoria/blob/main/packages/animoria-vscode/CHANGELOG.md) for details.

            ### Install
            Search **Animoria** in the VS Code Extensions panel,
            or download the `.vsix` for your platform from this release and install manually:

            ```
            code --install-extension animoria-${{ inputs.hotfix_jetbrains_version }}-<platform>.vsix
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
