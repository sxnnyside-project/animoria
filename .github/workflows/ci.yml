name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Quality Gate (just check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Install just
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: just
      - name: Cache cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/animoria-core-rust/target
          key: ${{ runner.os }}-cargo-gate-${{ hashFiles('packages/animoria-core-rust/Cargo.lock') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run quality gate
        run: just check

  cross-platform-matrix:
    name: Core matrix test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Run core tests
        run: cargo test --manifest-path packages/animoria-core-rust/Cargo.toml

  commitlint:
    name: Validate Conventional Commits
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - name: Validate PR commits with commitlint
        run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  rust-deny:
    name: Rust advisory & license check (cargo-deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: packages/animoria-core-rust/Cargo.toml

  jetbrains:
    name: JetBrains plugin (build, lint, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Cache cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/animoria-core-rust/target
          key: ${{ runner.os }}-cargo-jetbrains-${{ hashFiles('packages/animoria-core-rust/Cargo.lock') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build @animoria/ui
        run: pnpm --filter @animoria/ui build
      - name: Build native daemon (debug)
        run: cargo build --manifest-path packages/animoria-core-rust/Cargo.toml
      - name: Compile Kotlin
        working-directory: packages/animoria-jetbrains
        run: |
          chmod +x ./gradlew
          ./gradlew compileKotlin
      - name: Test (JUnit)
        working-directory: packages/animoria-jetbrains
        run: ./gradlew test
      - name: Lint (ktlint + detekt)
        working-directory: packages/animoria-jetbrains
        run: ./gradlew ktlintCheck detekt

  package-validation:
    name: Package validation (no publish)
    runs-on: ubuntu-24.04
    needs: [quality-gate, jetbrains]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install vsce
        run: npm install -g @vscode/vsce
      - name: Build all packages
        run: pnpm build
      - name: Build native daemon executable
        run: cargo build --release --manifest-path packages/animoria-core-rust/Cargo.toml
      - name: Copy native daemon into VS Code and JetBrains resources
        run: node scripts/copy-native-daemon.mjs
      - name: Package VS Code extension (dry run)
        working-directory: packages/animoria-vscode
        run: vsce package --no-dependencies -o /tmp/animoria-vscode-ci.vsix
      - name: Build JetBrains plugin assets
        run: |
          mkdir -p packages/animoria-jetbrains/src/main/resources/assets
          cp -r apps/animoria-sandbox/dist/* packages/animoria-jetbrains/src/main/resources/assets/
      - name: Build and verify JetBrains plugin (dry run)
        working-directory: packages/animoria-jetbrains
        run: |
          chmod +x ./gradlew
          ./gradlew buildPlugin verifyPlugin
