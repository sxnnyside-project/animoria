name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v3
        with:
          version: 11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v3
        with:
          version: 11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v3
        with:
          version: 11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v3
        with:
          version: 11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v3
        with:
          version: 11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test

  jetbrains:
    name: JetBrains plugin (build, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v3
        with:
          version: 11
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build @animoria/core
        run: pnpm --filter @animoria/core build
      - name: Compile Kotlin
        working-directory: packages/animoria-jetbrains
        run: |
          chmod +x ./gradlew
          ./gradlew compileKotlin
      - name: Lint (ktlint + detekt)
        working-directory: packages/animoria-jetbrains
        run: ./gradlew ktlintCheck detekt

  package-validation:
    name: Package validation (no publish)
    runs-on: ubuntu-latest
    needs: [build, jetbrains]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v3
        with:
          version: 11
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install vsce
        run: npm install -g @vscode/vsce
      - name: Build all packages
        run: pnpm build
      - name: Package VS Code extension (dry run)
        working-directory: packages/animoria-vscode
        run: vsce package --no-dependencies -o /tmp/animoria-vscode-ci.vsix
      - name: Build native daemon executable
        run: pnpm --filter @animoria/core build:sea
      - name: Copy native daemon into JetBrains resources
        run: node scripts/copy-sea-into-jetbrains.mjs
      - name: Build JetBrains plugin assets
        run: |
          mkdir -p packages/animoria-jetbrains/src/main/resources/assets
          cp -r apps/animoria-sandbox/dist/* packages/animoria-jetbrains/src/main/resources/assets/
      - name: Build and verify JetBrains plugin (dry run)
        working-directory: packages/animoria-jetbrains
        run: |
          chmod +x ./gradlew
          ./gradlew buildPlugin verifyPlugin
