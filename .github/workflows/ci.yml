name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-core:
    name: Rust core (clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)
        with:
          components: clippy, rustfmt
      - name: Cache cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/animoria-core-rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/animoria-core-rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Format check (rustfmt)
        run: cargo fmt --manifest-path packages/animoria-core-rust/Cargo.toml --check
      - name: Lint (clippy -D warnings)
        run: cargo clippy --manifest-path packages/animoria-core-rust/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path packages/animoria-core-rust/Cargo.toml

  rust-deny:
    name: Rust advisory & license check (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@34899fc7ba81ca0ab32e27c24864ca82f38f91f5 # v2.0.14
        with:
          command: check
          arguments: --manifest-path packages/animoria-core-rust/Cargo.toml

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test

  jetbrains:
    name: JetBrains plugin (build, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build @animoria/ui
        run: pnpm --filter @animoria/ui build
      - name: Compile Kotlin
        working-directory: packages/animoria-jetbrains
        run: |
          chmod +x ./gradlew
          ./gradlew compileKotlin
      # This job has always been named "build, lint, test" but never ran the tests,
      # so the Kotlin suite could not fail the build no matter what it contained.
      # Running the suite for the first time exposed that this job never built
      # @animoria/ui, which the JetBrains resources' copySharedUi task requires.
      - name: Test (JUnit)
        working-directory: packages/animoria-jetbrains
        run: ./gradlew test
      - name: Lint (ktlint + detekt)
        working-directory: packages/animoria-jetbrains
        run: ./gradlew ktlintCheck detekt

  package-validation:
    name: Package validation (no publish)
    runs-on: ubuntu-latest
    needs: [build, jetbrains]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install vsce
        run: npm install -g @vscode/vsce
      - name: Build all packages
        run: pnpm build
      - name: Build native daemon executable
        run: cargo build --release --manifest-path packages/animoria-core-rust/Cargo.toml
      - name: Copy native daemon into VS Code and JetBrains resources
        run: node scripts/copy-native-daemon.mjs
      - name: Package VS Code extension (dry run)
        working-directory: packages/animoria-vscode
        run: vsce package --no-dependencies -o /tmp/animoria-vscode-ci.vsix
      - name: Build JetBrains plugin assets
        run: |
          mkdir -p packages/animoria-jetbrains/src/main/resources/assets
          cp -r apps/animoria-sandbox/dist/* packages/animoria-jetbrains/src/main/resources/assets/
      - name: Build and verify JetBrains plugin (dry run)
        working-directory: packages/animoria-jetbrains
        run: |
          chmod +x ./gradlew
          ./gradlew buildPlugin verifyPlugin
