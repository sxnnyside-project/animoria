[graph]
targets = []

[advisories]
ignore = []

[licenses]
# Trimmed to the licenses the dependency graph actually carries today
# (`cargo deny check licenses` flags anything else here as
# "unmatched license allowance"). Add one back only once a real dependency
# needs it — an allowance nothing uses is a policy nobody is checking.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.8

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
