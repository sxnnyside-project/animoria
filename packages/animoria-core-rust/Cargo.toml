[package]
name = "animoria-core"
version = "2.3.0"
edition = "2021"
authors = ["Sxnnyside Project <houjou.sxnnyside@sxnnysideproject.com>"]
description = "High-performance Rust core engine for Animoria: visual asset discovery, format parsing, usage tracing, and governance."
license = "MIT"
repository = "https://github.com/sxnnyside-project/animoria"
homepage = "https://animoria.dev"
documentation = "https://docs.rs/animoria-core"
readme = "README.md"
keywords = ["asset", "governance", "linter", "lottie", "svg"]
categories = ["command-line-utilities", "development-tools", "multimedia::images"]
exclude = [
    "bindings/*",
    "tests/*",
    "benches/*",
    ".turbo/*",
]

[lib]
name = "animoria_core"
path = "src/lib.rs"

[[bin]]
name = "animoria"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
ignore = "0.4"
globset = "0.4"
sha2 = "0.10"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
aho-corasick = "1.1"
regex = "1.11"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ts-rs = { version = "10.1", features = ["no-serde-warnings", "serde-compat", "serde-json-impl"], optional = true }

[dev-dependencies]
tempfile = "3.17"
proptest = "1.5"

[[bench]]
name = "pipeline_benchmarks"
harness = false

[features]
default = ["ts-bindings"]
ts-bindings = ["dep:ts-rs"]

