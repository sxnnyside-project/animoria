# ## Why `kotlin.stdlib.default.dependency` is NOT set to false here
#
# The platform's configuration check advises plugins not to bundle their own Kotlin
# standard library, and the obvious reading is that this project should stop. It cannot,
# and the Plugin Verifier is unambiguous about why.
#
# Animoria compiles with Kotlin 2.4 and supports IntelliJ 2024.1 (since-build 241). Every
# suspend function the 2.4 compiler emits references `kotlin.coroutines.jvm.internal.
# SpillingKt`, a stdlib class that first appears in the Kotlin bundled with IntelliJ
# 2025.1:
#
#   IC-2024.1 / 2024.2 / 2024.3   SpillingKt absent
#   IC-2025.1 and later           SpillingKt present
#
# Excluding the bundled stdlib produced 8 compatibility problems on each of the three
# 2024.x IDEs — `NoSuchClassError` in `CoreProcessManager.sendCommand`,
# `JetBrainsHostBridge.call`, thumbnail loading and every other suspend entry point.
# That is the daemon protocol path, so the effect is a plugin that installs and then
# does nothing on a third of the supported matrix.
#
# So the stdlib stays bundled, as it was in 1.0.1, for exactly as long as the floor is
# 241. `ToolWindowContractTest` pins that floor, and this note is what should be
# revisited when it moves: on a 251 floor the exclusion becomes correct and free.
#
# kotlinx-coroutines is a different case and *is* taken from the platform — see the
# dependencies block in build.gradle.kts.

# The IntelliJ Platform Gradle Plugin resolves IDEs and the Plugin Verifier over the
# network and unpacks several GB; the default heap is not enough for the matrix.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
